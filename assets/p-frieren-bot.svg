    <text class="tag r" x="40" y="42">~/frieren-bot</text><text class="pn r" x="38" y="78" style="animation-delay:.12s">Frieren Bot</text><text class="pd r" x="40" y="106" style="animation-delay:0.25s">Frieren temalı büyü, ekonomi ve müzik sistemine sahip Discord</text><text class="pd r" x="40" y="126" style="animation-delay:0.33s">botu.</text><g class="r" style="animation-delay:0.50s"><rect x="40" y="142" width="93.0" height="24" rx="12" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.4"/><text class="chip" x="50" y="158.5">Discord.js</text></g><g class="r" style="animation-delay:0.58s"><rect x="141.0" y="142" width="71.1" height="24" rx="12" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.4"/><text class="chip" x="151.0" y="158.5">Node.js</text></g><text class="r" x="600" y="42" text-anchor="end" style="animation-delay:.3s;font:500 16px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;fill:#22D3EE;opacity:.6">↗</text>
