<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" width="640" height="190" role="img" aria-label="Rigel Download Manager">
  <style>
.tw { fill: #E0F2FE; opacity: var(--o); animation: tw 5s ease-in-out infinite; }
@keyframes tw { 0%, 100% { opacity: var(--o); } 50% { opacity: 0.08; } }
.r { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.neb { animation: drift 20s ease-in-out infinite alternate; }
.neb2 { animation: drift 24s ease-in-out infinite alternate-reverse; }
@keyframes drift { to { transform: translate(30px, -14px); } }
.cursor { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.tag { font: 500 13px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill: #22D3EE; letter-spacing: 2px; }
.h { font: 700 32px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #F8FAFC; letter-spacing: -0.5px; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .r { opacity: 1; }
}

.pn { font: 700 26px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #F8FAFC; letter-spacing: -0.4px; }
.pd { font: 400 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #CBD5E1; }
.chip { font: 500 12px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill: #CFFAFE; }
.st { font: 600 13px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill: #CFFAFE; }
</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0B1A2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.14" stop-color="#E0F2FE"/>
      <stop offset="0.4" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" x2="1">
      <stop offset="0" stop-color="#F0F9FF"/>
      <stop offset="1" stop-color="#F0F9FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A5F3FC" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"/></filter>
    <clipPath id="clip"><rect width="640" height="190" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="640" height="190" fill="url(#bg)"/>
    <ellipse class="neb" cx="600" cy="20" rx="170" ry="70" fill="#4C1D95" opacity="0.38" filter="url(#blur)"/><ellipse class="neb2" cx="660" cy="190" rx="120" ry="50" fill="#0F766E" opacity="0.22" filter="url(#blur)"/>
    <circle class="tw" cx="371.0" cy="40.7" r="1.3" style="animation-delay:-5.54s;animation-duration:4.87s;--o:0.56"/><circle class="tw" cx="140.7" cy="45.5" r="0.9" style="animation-delay:-2.91s;animation-duration:6.13s;--o:0.38"/><circle class="tw" cx="281.1" cy="51.4" r="0.8" style="animation-delay:-0.53s;animation-duration:6.08s;--o:0.40"/><circle class="tw" cx="302.2" cy="64.0" r="1.1" style="animation-delay:-2.53s;animation-duration:3.25s;--o:0.46"/><circle class="tw" cx="139.0" cy="122.1" r="1.3" style="animation-delay:-4.08s;animation-duration:5.66s;--o:0.69"/><circle class="tw" cx="253.8" cy="73.5" r="1.1" style="animation-delay:-0.46s;animation-duration:5.98s;--o:0.43"/><circle class="tw" cx="553.5" cy="44.6" r="0.6" style="animation-delay:-2.07s;animation-duration:3.09s;--o:0.59"/><circle class="tw" cx="11.9" cy="106.5" r="0.8" style="animation-delay:-5.91s;animation-duration:4.73s;--o:0.35"/><circle class="tw" cx="485.5" cy="78.0" r="0.9" style="animation-delay:-5.38s;animation-duration:5.28s;--o:0.29"/><circle class="tw" cx="535.9" cy="96.9" r="0.8" style="animation-delay:-4.15s;animation-duration:5.73s;--o:0.20"/><circle class="tw" cx="58.8" cy="11.7" r="0.9" style="animation-delay:-3.21s;animation-duration:5.81s;--o:0.44"/><circle class="tw" cx="519.2" cy="126.3" r="1.3" style="animation-delay:-4.65s;animation-duration:6.24s;--o:0.64"/><circle class="tw" cx="94.1" cy="37.8" r="0.8" style="animation-delay:-4.43s;animation-duration:6.57s;--o:0.45"/><circle class="tw" cx="564.7" cy="30.8" r="0.8" style="animation-delay:-5.31s;animation-duration:4.35s;--o:0.24"/><circle class="tw" cx="350.5" cy="128.7" r="0.9" style="animation-delay:-2.78s;animation-duration:3.77s;--o:0.57"/><circle class="tw" cx="211.7" cy="55.9" r="0.8" style="animation-delay:-1.50s;animation-duration:3.82s;--o:0.26"/><circle class="tw" cx="622.1" cy="166.4" r="0.9" style="animation-delay:-1.47s;animation-duration:4.12s;--o:0.74"/><circle class="tw" cx="116.6" cy="8.5" r="1.1" style="animation-delay:-5.14s;animation-duration:4.84s;--o:0.51"/><circle class="tw" cx="511.1" cy="48.5" r="0.9" style="animation-delay:-2.83s;animation-duration:3.78s;--o:0.53"/><circle class="tw" cx="204.0" cy="9.3" r="0.8" style="animation-delay:-1.73s;animation-duration:5.72s;--o:0.69"/><circle class="tw" cx="257.7" cy="15.7" r="0.8" style="animation-delay:-3.10s;animation-duration:3.86s;--o:0.57"/><circle class="tw" cx="97.6" cy="27.6" r="0.6" style="animation-delay:-2.68s;animation-duration:5.66s;--o:0.57"/><circle class="tw" cx="437.6" cy="70.9" r="1.3" style="animation-delay:-1.25s;animation-duration:4.83s;--o:0.51"/><circle class="tw" cx="194.5" cy="59.6" r="0.9" style="animation-delay:-1.44s;animation-duration:4.74s;--o:0.45"/><circle class="tw" cx="192.4" cy="13.2" r="0.6" style="animation-delay:-3.47s;animation-duration:4.37s;--o:0.68"/><circle class="tw" cx="281.4" cy="15.2" r="1.3" style="animation-delay:-4.26s;animation-duration:6.80s;--o:0.63"/><circle class="tw" cx="298.1" cy="181.1" r="0.6" style="animation-delay:-0.08s;animation-duration:6.71s;--o:0.57"/><circle class="tw" cx="489.6" cy="175.9" r="1.1" style="animation-delay:-4.48s;animation-duration:6.43s;--o:0.23"/>
    <text class="tag r" x="40" y="42">~/rigel-download-manager</text><text class="pn r" x="38" y="78" style="animation-delay:.12s">Rigel Download Manager</text><text class="pd r" x="40" y="106" style="animation-delay:0.25s">Linux için açık kaynak IDM alternatifi. Tarayıcıdaki videoyu</text><text class="pd r" x="40" y="126" style="animation-delay:0.33s">yakalar, yt-dlp ve aria2 ile indirir.</text><g class="r" style="animation-delay:0.50s"><rect x="40" y="142" width="56.5" height="24" rx="12" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.4"/><text class="chip" x="50" y="158.5">Tauri</text></g><g class="r" style="animation-delay:0.58s"><rect x="104.5" y="142" width="71.1" height="24" rx="12" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.4"/><text class="chip" x="114.5" y="158.5">Next.js</text></g><g class="r" style="animation-delay:0.66s"><rect x="183.6" y="142" width="93.0" height="24" rx="12" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.4"/><text class="chip" x="193.6" y="158.5">Chrome MV3</text></g><text class="r" x="600" y="42" text-anchor="end" style="animation-delay:.3s;font:500 16px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;fill:#22D3EE;opacity:.6">↗</text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="189" rx="18" fill="none" stroke="#22D3EE" stroke-opacity="0.16"/>
</svg>
