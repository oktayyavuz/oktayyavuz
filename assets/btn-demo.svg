<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" width="340" height="60" role="img" aria-label="TürkAnimeList canlı demo">
  <style>
.tw { fill: #E0F2FE; opacity: var(--o); animation: tw 5s ease-in-out infinite; }
@keyframes tw { 0%, 100% { opacity: var(--o); } 50% { opacity: 0.08; } }
.r { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.neb { animation: drift 20s ease-in-out infinite alternate; }
.neb2 { animation: drift 24s ease-in-out infinite alternate-reverse; }
@keyframes drift { to { transform: translate(30px, -14px); } }
.cursor { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.tag { font: 500 13px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill: #22D3EE; letter-spacing: 2px; }
.h { font: 700 32px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #F8FAFC; letter-spacing: -0.5px; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .r { opacity: 1; }
}

.lbl { font: 600 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #F8FAFC; letter-spacing: .4px; }
.arr { font: 500 14px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill: #22D3EE; opacity: .55; }
.sweep { animation: sweep 7s ease-in-out infinite; }
@keyframes sweep { 0% { transform: translateX(-140px); } 22%, 100% { transform: translateX(480px); } }</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0B1A2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.14" stop-color="#E0F2FE"/>
      <stop offset="0.4" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" x2="1">
      <stop offset="0" stop-color="#F0F9FF"/>
      <stop offset="1" stop-color="#F0F9FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A5F3FC" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="clip"><rect width="340" height="60" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="340" height="60" fill="url(#bg)"/>
    
    <circle class="tw" cx="250.5" cy="30.8" r="1.1" style="animation-delay:-1.11s;animation-duration:5.13s;--o:0.31"/><circle class="tw" cx="185.1" cy="47.3" r="1.1" style="animation-delay:-3.66s;animation-duration:6.57s;--o:0.57"/><circle class="tw" cx="43.3" cy="48.4" r="1.1" style="animation-delay:-3.18s;animation-duration:4.38s;--o:0.52"/><circle class="tw" cx="61.5" cy="47.6" r="1.3" style="animation-delay:-5.98s;animation-duration:4.02s;--o:0.22"/><circle class="tw" cx="74.9" cy="38.9" r="0.8" style="animation-delay:-4.58s;animation-duration:4.79s;--o:0.53"/><circle class="tw" cx="271.9" cy="21.2" r="1.1" style="animation-delay:-0.90s;animation-duration:4.63s;--o:0.43"/><circle class="tw" cx="181.9" cy="32.5" r="0.6" style="animation-delay:-5.18s;animation-duration:4.00s;--o:0.44"/>
    
    <g class="sweep" style="animation-delay:0.3s"><rect x="0" y="0" width="120" height="60" fill="url(#shine)" transform="skewX(-20)"/></g>
    <g transform="translate(22 18)"><g class="r"><g fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M10 8.2v7.6l6-3.8z" fill="#22D3EE"/></g></g></g>
    <text class="lbl r" x="58" y="36.5" style="animation-delay:.1s">TürkAnimeList canlı demo</text>
    <text class="arr r" x="310" y="35" style="animation-delay:.2s">↗</text>
  </g>
  <rect x="0.5" y="0.5" width="339" height="59" rx="14" fill="none" stroke="#22D3EE" stroke-opacity="0.16"/>
</svg>
