<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Oktay Yavuz — Full Stack Developer">
  <style>
    .tw { fill: #E0F2FE; opacity: var(--o); animation: tw 5s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: var(--o); } 50% { opacity: 0.08; } }

    .name { font: 700 54px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #F8FAFC; letter-spacing: -1px;
             opacity: 0; animation: rise 1s cubic-bezier(.2,.7,.2,1) .2s forwards; }
    .tag  { font: 500 15px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill: #22D3EE; letter-spacing: 2px;
             opacity: 0; animation: rise 1s cubic-bezier(.2,.7,.2,1) forwards; }
    .prompt { font: 500 19px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill: #22D3EE;
             opacity: 0; animation: rise 1s cubic-bezier(.2,.7,.2,1) .4s forwards; }
    .role { font: 500 19px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill: #CFFAFE;
             opacity: 0; animation: role 10.5s ease-in-out infinite both; }
    .foot { font: 500 13px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill: #64748B; letter-spacing: 1px;
             opacity: 0; animation: rise 1s ease .8s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes role {
      0%   { opacity: 0; transform: translateY(10px); }
      5%   { opacity: 1; transform: none; }
      28%  { opacity: 1; transform: none; }
      33%  { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 0; transform: translateY(-10px); }
    }

    .glow  { transform-origin: 930px 128px; animation: pulse 4s ease-in-out infinite; }
    .flare { transform-origin: 930px 128px; animation: spin 40s linear infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.18); opacity: 1; } }
    @keyframes spin  { to { transform: rotate(360deg); } }

    .neb1 { animation: drift 18s ease-in-out infinite alternate; }
    .neb2 { animation: drift 22s ease-in-out infinite alternate-reverse; }
    @keyframes drift { to { transform: translate(40px, -18px); } }

    .shoot { opacity: 0; animation: shoot 9s ease-in 3s infinite; }
    @keyframes shoot {
      0%   { opacity: 0; transform: translate(0, 0); }
      2%   { opacity: 1; }
      9%   { opacity: 0; transform: translate(-420px, 170px); }
      100% { opacity: 0; transform: translate(-420px, 170px); }
    }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .name, .tag, .prompt, .foot { opacity: 1; }
      .role:first-of-type { opacity: 1; }
    }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0B1A2E"/>
    </linearGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.12" stop-color="#E0F2FE"/>
      <stop offset="0.35" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flareH" x1="0" x2="1">
      <stop offset="0" stop-color="#BAE6FD" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F0F9FF"/>
      <stop offset="1" stop-color="#BAE6FD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" x2="1">
      <stop offset="0" stop-color="#F0F9FF"/>
      <stop offset="1" stop-color="#F0F9FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <ellipse class="neb1" cx="880" cy="95" rx="260" ry="110" fill="#0E7490" opacity="0.35" filter="url(#blur)"/>
    <ellipse class="neb2" cx="1050" cy="210" rx="220" ry="90" fill="#4C1D95" opacity="0.30" filter="url(#blur)"/>

