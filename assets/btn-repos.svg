<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 60" width="215" height="60" role="img" aria-label="Tüm repolar">
  <style>
.tw { fill: #E0F2FE; opacity: var(--o); animation: tw 5s ease-in-out infinite; }
@keyframes tw { 0%, 100% { opacity: var(--o); } 50% { opacity: 0.08; } }
.r { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.neb { animation: drift 20s ease-in-out infinite alternate; }
.neb2 { animation: drift 24s ease-in-out infinite alternate-reverse; }
@keyframes drift { to { transform: translate(30px, -14px); } }
.cursor { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.tag { font: 500 13px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill: #22D3EE; letter-spacing: 2px; }
.h { font: 700 32px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #F8FAFC; letter-spacing: -0.5px; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .r { opacity: 1; }
}

.lbl { font: 600 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #F8FAFC; letter-spacing: .4px; }
.arr { font: 500 14px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill: #22D3EE; opacity: .55; }
.sweep { animation: sweep 7s ease-in-out infinite; }
@keyframes sweep { 0% { transform: translateX(-140px); } 22%, 100% { transform: translateX(355px); } }</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0B1A2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.14" stop-color="#E0F2FE"/>
      <stop offset="0.4" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" x2="1">
      <stop offset="0" stop-color="#F0F9FF"/>
      <stop offset="1" stop-color="#F0F9FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A5F3FC" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="clip"><rect width="215" height="60" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="215" height="60" fill="url(#bg)"/>
    
    <circle class="tw" cx="168.2" cy="21.6" r="0.8" style="animation-delay:-1.16s;animation-duration:6.76s;--o:0.36"/><circle class="tw" cx="199.5" cy="54.0" r="0.8" style="animation-delay:-0.87s;animation-duration:5.52s;--o:0.48"/><circle class="tw" cx="178.8" cy="7.4" r="1.1" style="animation-delay:-1.04s;animation-duration:6.25s;--o:0.48"/><circle class="tw" cx="175.6" cy="14.8" r="0.9" style="animation-delay:-0.70s;animation-duration:5.20s;--o:0.34"/><circle class="tw" cx="101.3" cy="16.8" r="0.6" style="animation-delay:-0.49s;animation-duration:3.80s;--o:0.51"/><circle class="tw" cx="94.8" cy="39.8" r="0.6" style="animation-delay:-0.60s;animation-duration:6.21s;--o:0.59"/><circle class="tw" cx="49.0" cy="21.8" r="0.6" style="animation-delay:-0.57s;animation-duration:4.84s;--o:0.24"/>
    
    <g class="sweep" style="animation-delay:0.9s"><rect x="0" y="0" width="120" height="60" fill="url(#shine)" transform="skewX(-20)"/></g>
