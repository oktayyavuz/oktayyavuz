    <text class="lbl r" x="58" y="36.5" style="animation-delay:.1s">Discord</text>
    <text class="arr r" x="147" y="35" style="animation-delay:.2s">↗</text>
  </g>
  <rect x="0.5" y="0.5" width="176" height="59" rx="14" fill="none" stroke="#22D3EE" stroke-opacity="0.16"/>
</svg>
