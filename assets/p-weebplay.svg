le="animation-delay:-3.75s;animation-duration:4.55s;--o:0.59"/><circle class="tw" cx="325.4" cy="168.7" r="1.1" style="animation-delay:-1.18s;animation-duration:4.95s;--o:0.24"/><circle class="tw" cx="561.5" cy="106.1" r="1.1" style="animation-delay:-1.35s;animation-duration:3.29s;--o:0.22"/><circle class="tw" cx="41.1" cy="144.9" r="1.1" style="animation-delay:-3.68s;animation-duration:6.66s;--o:0.44"/><circle class="tw" cx="51.2" cy="97.3" r="1.3" style="animation-delay:-2.13s;animation-duration:6.10s;--o:0.70"/><circle class="tw" cx="294.4" cy="8.0" r="1.3" style="animation-delay:-1.62s;animation-duration:6.55s;--o:0.34"/><circle class="tw" cx="337.5" cy="86.7" r="0.8" style="animation-delay:-0.98s;animation-duration:4.95s;--o:0.27"/><circle class="tw" cx="464.1" cy="16.8" r="0.9" style="animation-delay:-0.07s;animation-duration:4.75s;--o:0.27"/><circle class="tw" cx="508.1" cy="93.1" r="0.9" style="animation-delay:-1.45s;animation-duration:5.78s;--o:0.67"/><circle class="tw" cx="177.7" cy="140.3" r="0.9" style="animation-delay:-2.83s;animation-duration:6.52s;--o:0.59"/><circle class="tw" cx="320.2" cy="152.1" r="0.8" style="animation-delay:-3.71s;animation-duration:3.93s;--o:0.51"/>
    <text class="tag r" x="40" y="42">~/weebplay</text><text class="pn r" x="38" y="78" style="animation-delay:.12s">WeebPlay</text><text class="pd r" x="40" y="106" style="animation-delay:0.25s">PiP, kaldığın yerden devam, hareket kontrolleri ve dahili fotoğraf</text><text class="pd r" x="40" y="126" style="animation-delay:0.33s">düzenleyicili medya oynatıcı.</text><g class="r" style="animation-delay:0.50s"><rect x="40" y="142" width="71.1" height="24" rx="12" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.4"/><text class="chip" x="50" y="158.5">Flutter</text></g><g class="r" style="animation-delay:0.58s"><rect x="119.1" y="142" width="49.2" height="24" rx="12" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.4"/><text class="chip" x="129.1" y="158.5">Dart</text></g><text class="r" x="600" y="42" text-anchor="end" style="animation-delay:.3s;font:500 16px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;fill:#22D3EE;opacity:.6">↗</text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="189" rx="18" fill="none" stroke="#22D3EE" stroke-opacity="0.16"/>
</svg>
