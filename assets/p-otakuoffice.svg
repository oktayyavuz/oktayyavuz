e="animation-delay:-3.76s;animation-duration:3.65s;--o:0.44"/><circle class="tw" cx="187.5" cy="160.7" r="0.9" style="animation-delay:-3.58s;animation-duration:6.67s;--o:0.50"/><circle class="tw" cx="266.1" cy="53.5" r="0.6" style="animation-delay:-2.40s;animation-duration:5.38s;--o:0.38"/><circle class="tw" cx="504.9" cy="80.8" r="0.8" style="animation-delay:-2.75s;animation-duration:4.78s;--o:0.74"/><circle class="tw" cx="361.2" cy="123.5" r="1.3" style="animation-delay:-0.06s;animation-duration:4.95s;--o:0.21"/><circle class="tw" cx="215.5" cy="49.0" r="1.1" style="animation-delay:-4.25s;animation-duration:4.51s;--o:0.26"/><circle class="tw" cx="431.3" cy="121.4" r="1.3" style="animation-delay:-4.69s;animation-duration:5.20s;--o:0.26"/><circle class="tw" cx="38.9" cy="172.3" r="1.3" style="animation-delay:-2.11s;animation-duration:6.20s;--o:0.23"/><circle class="tw" cx="559.5" cy="106.0" r="0.8" style="animation-delay:-1.52s;animation-duration:6.95s;--o:0.25"/><circle class="tw" cx="190.5" cy="73.6" r="1.1" style="animation-delay:-1.78s;animation-duration:4.65s;--o:0.71"/><circle class="tw" cx="369.0" cy="89.2" r="1.3" style="animation-delay:-5.88s;animation-duration:6.77s;--o:0.26"/>
    <text class="tag r" x="40" y="42">~/otakuoffice</text><text class="pn r" x="38" y="78" style="animation-delay:.12s">Otaku Office</text><text class="pd r" x="40" y="106" style="animation-delay:0.25s">Not defteri, PDF araçları, yapılacaklar listesi ve e-posta</text><text class="pd r" x="40" y="126" style="animation-delay:0.33s">şablonlarını birleştiren masaüstü uygulaması.</text><g class="r" style="animation-delay:0.50s"><rect x="40" y="142" width="78.4" height="24" rx="12" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.4"/><text class="chip" x="50" y="158.5">Electron</text></g><g class="r" style="animation-delay:0.58s"><rect x="126.4" y="142" width="56.5" height="24" rx="12" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.4"/><text class="chip" x="136.4" y="158.5">React</text></g><g class="r" style="animation-delay:0.66s"><rect x="190.9" y="142" width="93.0" height="24" rx="12" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.4"/><text class="chip" x="200.9" y="158.5">TypeScript</text></g><text class="r" x="600" y="42" text-anchor="end" style="animation-delay:.3s;font:500 16px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;fill:#22D3EE;opacity:.6">↗</text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="189" rx="18" fill="none" stroke="#22D3EE" stroke-opacity="0.16"/>
